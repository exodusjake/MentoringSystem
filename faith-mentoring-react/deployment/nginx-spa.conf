# Include inside the server block that serves the React app. The API remains on
# its configured backend host; missing client routes must fall back to index.html.
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|woff2?|ttf|json|ico|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location / {
    try_files $uri $uri/ /index.html;
}
