<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AstraMentoring</title>
  <link rel="icon" href="/IMAGES/fav-con.png"/>
  <link rel="apple-touch-icon" href="/IMAGES/icons/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <!-- Each route's stylesheets are inserted here, in the original page's order (src/app/pageStyles.js). -->
  <meta name="astra-page-styles"/>
  <!-- Applies the saved light/dark theme before first paint. -->
  <script src="/theme.js"></script>
  <style>#root{display:contents}html.page-loading *,html.page-loading *::before,html.page-loading *::after{transition:none!important;animation:none!important}@keyframes astraMainIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes astraMainOut{to{opacity:0;transform:translateY(-8px)}}.main-wrapper.main-enter{animation:astraMainIn .4s cubic-bezier(.22,1,.36,1) both}.main-wrapper.main-leave{animation:astraMainOut .18s ease both;pointer-events:none}@media (prefers-reduced-motion:reduce){.main-wrapper.main-enter,.main-wrapper.main-leave{animation:none}}@keyframes astraPageOut{from{opacity:1}to{opacity:0}}body.page-leave{animation:astraPageOut .22s ease both;pointer-events:none}@keyframes astraPageIn{from{opacity:0}to{opacity:1}}body.page-enter{animation:astraPageIn .3s ease both}@media (prefers-reduced-motion:reduce){body.page-enter{animation:none}}
  /* Every button: soft colour/shadow transitions and a small press. Zero specificity, so any button that has its own
     transition keeps it; the press uses the separate `scale` property so it never fights a button's own transform. */
  :where(button,[role="button"],.btn,input[type="button"],input[type="submit"],input[type="reset"],summary){transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease,filter .2s ease,scale .16s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent}
  :where(button,[role="button"],.btn,input[type="button"],input[type="submit"],input[type="reset"]):not(:disabled):not([aria-disabled="true"]):active{scale:.97}
  @media (prefers-reduced-motion:reduce){:where(button,[role="button"],.btn,input[type="button"],input[type="submit"],input[type="reset"],summary){transition:none}:where(button,[role="button"],.btn):active{scale:1!important}}

  /* Phones / small tablets, every portal and public page: the page must never be wider than the screen. A wide table or grid
     used to stretch the layout once data loaded, and the phone then zoomed out and shifted the page sideways. Grid / card
     columns may shrink below their content, media is capped, and wide tables scroll inside their own box. */
  @media screen and (max-width:900px){
    html,body{overflow-x:hidden;max-width:100%}
    .main-wrapper,.page-content,main{min-width:0;max-width:100%}
    .main-wrapper :is([class*="grid"],[class*="-card"],[class*="card-"],.card,.table-card,section):not([class*="modal"]):not([class*="overlay"]):not([class*="dialog"]){min-width:0;max-width:100%}
    .main-wrapper :is(.table-wrapper,.table-scroll,.history-table-wrap,[class*="table-wrap"]){max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    img,video,canvas,iframe,svg{max-width:100%}
  }

  /* Swipe hint under sideways-scrolling strips (see installScrollHints) */
  .scroll-hint{display:none}
  @media screen and (max-width:620px){
    .scroll-hint{display:flex;align-items:center;justify-content:center;gap:10px;margin:-2px 0 12px;font-size:11px;font-weight:600;color:#6b7280;letter-spacing:.02em}
    .sh-dots{display:inline-flex;align-items:center;gap:5px}
    .sh-dot{display:block;width:6px;height:6px;border-radius:99px;background:#cbd5e1;transition:width .25s ease,background-color .25s ease}
    .sh-dot.on{width:16px;background:#2563eb}
    .sh-text::after{content:"\203A";display:inline-block;margin-left:4px;font-size:14px;line-height:1;animation:shNudge 1.3s ease-in-out infinite}
    @keyframes shNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
    .sh-more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent)}
    .sh-more-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 30px),transparent)}
    .sh-more-l.sh-more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 30px,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to right,transparent,#000 30px,#000 calc(100% - 30px),transparent)}
  }
  @media (prefers-reduced-motion:reduce){.sh-text::after{animation:none}}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
