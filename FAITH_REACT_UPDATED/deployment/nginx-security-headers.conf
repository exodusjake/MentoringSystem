# Security headers for the React site. Include inside the `server` block that serves the site:
#     include /etc/nginx/snippets/astra-security-headers.conf;
# (copy this file there first; see DEPLOY.md, "Security headers").
#
# `always` keeps the headers on error pages too. nginx does NOT inherit add_header into a location that has its
# own add_header, so if you add one (e.g. caching for /assets/), include this file there as well.

server_tokens off;   # (http/server level) hides the nginx version

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Scripts only from this site (+ the Lenis smooth-scroll library on jsDelivr). Inline <script> is blocked, which is
# what stops injected scripts from running. The one exception: the print windows (logsheets, reports, calendar sheet)
# are written with document.write and carry a few fixed inline snippets (onclick="window.print()", an onload print
# script, an image fallback). Each is allowed by its exact SHA-256 hash ('unsafe-hashes' covers the event-handler
# ones), not by 'unsafe-inline'. If any of that inline code changes, regenerate the hashes (see DEPLOY.md). Styles allow 'unsafe-inline' because the app injects <style> tags.
# Images/PDFs come from this site (the API is proxied on the same origin) and from blob:/data: (QR codes, previews).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-pwQduWxX3Cm7lLbQmAos7n73RLP4QrsCDFejmsBdZ78=' 'sha256-MguIPR6qNR8D3B+eAlK+bIRTZe8t3wkOY4B/56Me9FU=' 'sha256-jqxtvDkBbRAl9Hpqv68WdNOieepg8tJSYu1xIy7zT34=' 'sha256-lmfqkfouvvuBDyPeKf0PKmXv9BhpQW9G322NKpcNp54=' 'sha256-58L0pQAF6/nDeFnMoL3QYhN2kTBgvq64DqRK8p0ATh0=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
