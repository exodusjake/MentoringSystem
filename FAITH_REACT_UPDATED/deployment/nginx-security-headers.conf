# Security headers for the React site. Include inside the `server` block that serves the site:
#     include /etc/nginx/snippets/astra-security-headers.conf;
# (copy this file there first; see DEPLOY.md, "Security headers").
#
# `always` keeps the headers on error pages too. nginx does NOT inherit add_header into a location that has its
# own add_header, so if you add one (e.g. caching for /assets/), include this file there as well.

server_tokens off;   # (http/server level) hides the nginx version

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Scripts only from this site (+ the Lenis smooth-scroll library on jsDelivr). Inline <script> is blocked, which is
# what stops injected scripts from running. Styles allow 'unsafe-inline' because the app injects <style> tags.
# Images/PDFs come from this site (the API is proxied on the same origin) and from blob:/data: (QR codes, previews).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
