<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mentor Detail — Admin Portal</title>
  <link rel="stylesheet" href="/ADMIN_/CSS/sidebar.css"/>
  <link rel="stylesheet" href="/ADMIN_/CSS/sessions.css"/>
  <link rel="stylesheet" href="/ADMIN_/CSS/monitor-activities.css"/>
  <link rel="stylesheet" href="/ADMIN_/CSS/tabler-icons.min.css"/>
  <link rel="icon" href="/IMAGES/fav-con.png"/>
  <link rel="apple-touch-icon" href="/IMAGES/icons/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="stylesheet" href="/ADMIN_/CSS/page-polish.css"/>
  <script src="/theme.js"></script>
</head>
<body class="admin-polish session-detail">

  <div id="sidebar-container"></div>

  <div class="main-wrapper">
    <main class="page-content">

      <div class="detail-back-bar">
        <a href="sessions.html" class="btn-back" onclick="event.preventDefault(); var s=new URLSearchParams(location.search).get('school'); window.location.href='sessions.html'+(s?'?school='+encodeURIComponent(s):'');">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back to Mentor Monitoring
        </a>
      </div>

      <!-- Mentor hero -->
      <div class="mentor-hero" id="mentorHero">
        <div class="hero-avatar av-0" id="heroAvatar">—</div>
        <div class="hero-info">
          <div class="hero-name-row">
            <div class="hero-name" id="heroName">Loading…</div>
            <div class="sd-badge-wrap">
              <span class="hero-badge" id="heroBadge" style="display:none;"></span>
              <div class="sd-tip-wrap" id="sdTipWrap" style="display:none;">
                <i class="ti ti-alert-circle sd-tip-icon"></i>
                <div class="sd-tip-box" id="sdTipBox"></div>
              </div>
            </div>
          </div>
          <div class="hero-meta" id="heroMeta"></div>
        </div>
      </div>

      <!-- Session cards -->
      <div class="sessions-section">
        <div class="sessions-section-head">
          <div>
            <span class="sessions-section-title">Mentoring Sessions</span>
            <span id="sessionCount" class="sessions-section-count"></span>
          </div>
          <div class="print-btn-group" onclick="event.stopPropagation()">
            <button class="btn-print-main" onclick="printAllSessions('all')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print All
            </button>
            <button class="btn-print-caret" onclick="togglePrintAllMenu()">
              <i class="ti ti-chevron-down"></i>
            </button>
            <div class="print-dropdown" id="printMenu-all">
              <button class="print-drop-item" onclick="printAllSessions('all');closePrintAllMenu()"><i class="ti ti-files"></i> All Forms</button>
              <button class="print-drop-item" onclick="printAllSessions('logsheet');closePrintAllMenu()"><i class="ti ti-clipboard-list"></i> Logsheet</button>
              <button class="print-drop-item" onclick="printAllSessions('notes');closePrintAllMenu()"><i class="ti ti-notes"></i> Mentor's Notes</button>
              <button class="print-drop-item" onclick="printAllSessions('nonattend');closePrintAllMenu()"><i class="ti ti-user-x"></i> Non-Attendance</button>
            </div>
          </div>
        </div>

        <div class="toolbar" style="margin-bottom:16px;">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="topicSearch" placeholder="Search by topic…"/>
          </div>
          <select class="filter-select" id="sectionFilter">
            <option value="">All Sections</option>
          </select>
          <select class="filter-select" id="statusFilter">
            <option value="">All Statuses</option>
            <option value="Scheduled">Scheduled</option>
          <option value="In Progress">In Progress</option>
          <option value="Closed">Closed</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <select class="filter-select" id="periodFilter">
            <option value="">All School Years</option>
          </select>
          <button class="filter-reset" onclick="resetDetailFilters()">Clear</button>
        </div>

        <div class="session-list" id="sessionCardsGrid">
          <div class="empty-state"><span class="spinner"></span> Loading…</div>
        </div>
      </div>


    </main>

    <footer>
      <p>&copy; 2026 AstraMentoring. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
      </div>
    </footer>
  </div>

  <!-- ── Logsheet Modal ──────────────────────────────────────── -->
  <div class="modal-overlay" id="logsheetOverlay" style="display:none;" onclick="closeLogsheet(event)">
    <div class="logsheet-modal" onclick="event.stopPropagation()">

      <div class="lm-header">
        <div>
          <div class="lm-title-row">
            <div class="lm-title" id="lmSessionLabel">Mentoring Logsheet</div>
            <span class="lm-logstatus-badge" id="lmLogStatusBadge" style="display:none"></span>
          </div>
          <div class="lm-sub"  id="lmSubtitle"></div>
        </div>
        <button class="lm-close" onclick="closeLogsheet()">&times;</button>
      </div>

      <div class="lm-tabs">
        <button class="lm-tab active" data-tab="logsheet"  onclick="switchTab('logsheet')">Mentoring Logsheet</button>
        <button class="lm-tab"        data-tab="notes"     onclick="switchTab('notes')">Mentor's Notes</button>
        <button class="lm-tab"        data-tab="nonattend" onclick="switchTab('nonattend')">Non-Attendance Report</button>
      </div>

      <div class="lm-body">
        <div id="tabContent">
          <div class="tab-loading"><span class="spinner"></span> Loading…</div>
        </div>
      </div>

      <div class="lm-footer">
        <button class="btn-outline" onclick="closeLogsheet()">Close</button>
        <button class="btn-primary" onclick="printCurrentTab()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Print / Export PDF
        </button>
      </div>

    </div>
  </div>

  <!-- ── Proof Lightbox ──────────────────────────────────────── -->
  <div id="lightboxOverlay" class="lightbox-overlay" style="display:none;" onclick="closeLightbox(event)">
    <div class="lightbox-inner" onclick="event.stopPropagation()">
      <div class="lightbox-header">
        <span class="lightbox-title" id="lightboxTitle">Session Proof</span>
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
      </div>
      <div class="lightbox-body" id="lightboxBody"></div>
      <div class="lightbox-footer">
        <a class="lightbox-download" id="lightboxDownload" href="#" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>
      </div>
    </div>
  </div>

  <!-- ── Error Modal ─────────────────────────────────────────── -->
  <div id="errorModal" class="info-modal-overlay" style="display:none;">
    <div class="info-modal">
      <div class="info-modal-icon danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h3 class="info-modal-title">Something went wrong</h3>
      <p class="info-modal-message" id="errorMessage">An error occurred.</p>
      <button class="btn-primary" onclick="hideErrorModal()" style="width:100%;justify-content:center;">OK</button>
    </div>
  </div>

  <script src="/ADMIN_/JS/sidebar.js"></script>
  <script src="/sidebar-indicator.js"></script>
  <script src="/empty-states.js"></script>
  <script src="/smooth-scroll.js"></script>
  <script src="../../config.js"></script>
  <script src="../../print-logsheet-styles.js"></script>
  <script src="../../apiClient.js"></script>
  <script src="../../security-utils.js"></script>
  <script src="/logsheet-data.js"></script>
  <script src="/dashboard-sessions.js"></script>
<script src="/ADMIN_/JS/sessions-detail.js"></script>
</body>
</html>
