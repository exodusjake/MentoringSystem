<!-- MENTOR Sidebar — mentor-sidebar.html -->
<link rel="stylesheet" href="/ADMIN_/CSS/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Mobile hamburger -->
<button class="hamburger" id="hamburger" aria-label="Toggle menu">
  <i class="ti ti-menu-2"></i>
</button>

<!-- Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">

  <!-- Brand -->
  <div class="sb-brand">
    <img src="/IMAGES/LOGO-mark.png" alt="Astra Mentoring"/>
    <span>AstraMentoring</span>
  </div>

  <!-- User profile -->
  <a href="profile.html" class="sb-profile" id="sbProfileLink">
    <div class="sb-avatar" id="sidebarAvatar">MU</div>
    <div class="sb-info">
      <div class="sb-name" id="sidebarName">Mentor User</div>
      <div class="sb-role">Mentor</div>
      <div class="sb-dept" id="sidebarDept"></div>
    </div>
  </a>

  <!-- Navigation -->
  <nav class="sidebar-nav" aria-label="Main navigation">

    <div class="nav-section">Overview</div>
    <a href="mentor-dashboard.html" class="nav-item" id="nav-dashboard">
      <i class="ti ti-layout-dashboard"></i>
      Dashboard
    </a>

    <div class="nav-section">Mentoring</div>
    <a href="my-mentees.html" class="nav-item" id="nav-mentees">
      <i class="ti ti-users"></i>
      My Mentees
    </a>
    <a href="sessions.html" class="nav-item" id="nav-sessions">
      <i class="ti ti-calendar-event"></i>
      Sessions
    </a>
    <a href="availability.html" class="nav-item" id="nav-availability">
      <i class="ti ti-clock-plus"></i>
      Availability
    </a>
    <a href="logsheet.html" class="nav-item" id="nav-logsheet">
      <i class="ti ti-clipboard-list"></i>
      Logsheet
    </a>
    <a href="my-activities.html" class="nav-item" id="nav-activities">
      <i class="ti ti-activity"></i>
      Attendance Overview
    </a>

    <div class="nav-section">Content</div>
    <a href="announcements.html" class="nav-item" id="nav-announce">
      <i class="ti ti-speakerphone"></i>
      Announcements
      <span class="nav-badge" id="annBadge" style="display:none"></span>
    </a>
    <a href="calendar.html" class="nav-item" id="nav-calendar">
      <i class="ti ti-calendar"></i>
      Calendar
    </a>

    <div class="nav-section">Account</div>
    <a href="profile.html" class="nav-item" id="nav-profile">
      <i class="ti ti-user-circle"></i>
      Profile
    </a>

  </nav>

  <!-- Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="showLogoutModal()">
      <i class="ti ti-logout"></i>
      Logout
    </button>
  </div>

</aside>

<!-- Logout Confirmation Modal -->
<div id="logoutModal" class="logout-modal-overlay">
  <div class="logout-modal">
    <div class="logout-modal-icon">
      <i class="ti ti-logout"></i>
    </div>
    <h3>Confirm Logout</h3>
    <p>Are you sure you want to log out of the mentor portal?</p>
    <div class="logout-modal-btns">
      <button class="btn-cancel" onclick="hideLogoutModal()">Cancel</button>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </div>
</div>
